name: Determinism & Safety Validation CI

on:
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: 'Executar benchmark de determinismo (gera e valida benchmark.loci)'
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test_x86_64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Protoc (Required for prost)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Build
      run: cargo build --verbose
    - name: Run All Tests (includes determinism + iterator safety)
      run: cargo test --verbose
    - name: Run Determinism Benchmark & Replay Verification
      if: ${{ inputs.run_benchmark != false }}
      run: cargo run --release --bin benchmark
    - name: Upload Benchmark Replay Artifact (x86_64)
      if: ${{ inputs.run_benchmark != false }}
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-replay-x86_64
        path: benchmark.loci
      
  test_arm64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Protoc
      run: brew install protobuf
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('**/Cargo.lock') }}
    - name: Build
      run: cargo build --verbose
    - name: Run All Tests (includes determinism + iterator safety)
      run: cargo test --verbose
    - name: Run Determinism Benchmark & Replay Verification
      if: ${{ inputs.run_benchmark != false }}
      run: cargo run --release --bin benchmark
    - name: Upload Benchmark Replay Artifact (arm64)
      if: ${{ inputs.run_benchmark != false }}
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-replay-arm64
        path: benchmark.loci

